{% extends 'base.html' %}
{% block title %}Menu - Food Ordering{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0"><i class="bi bi-menu-app"></i> Browse Menu</h3>
    <button class="btn btn-outline-primary position-relative" id="viewCartBtn" onclick="location.href='/cart/'">
        <i class="bi bi-cart"></i> Cart
        <span class="badge bg-danger rounded-pill" id="cartCountBadge">0</span>
    </button>
</div>

<div class="mb-4" id="categoryFilters">
    <span class="category-chip active" data-category="">All</span>
    <span class="category-chip" data-category="rice">Rice Meals</span>
    <span class="category-chip" data-category="noodles">Noodles</span>
    <span class="category-chip" data-category="drinks">Drinks</span>
    <span class="category-chip" data-category="snacks">Snacks</span>
    <span class="category-chip" data-category="desserts">Desserts</span>
</div>

<div class="row g-3" id="menuGrid">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Loading menu...</p>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
    <div id="cartToast" class="toast" role="alert">
        <div class="toast-body d-flex align-items-center">
            <i class="bi bi-check-circle-fill text-success me-2"></i>
            <span id="cartToastMsg">Item added to cart!</span>
            <button type="button" class="btn-close ms-2" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let currentCategory = '';
let cartData = { items: [], total_items: 0, total_price: 0 };

document.querySelectorAll('.category-chip').forEach(chip => {
    chip.addEventListener('click', function() {
        document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        loadMenu();
    });
});

async function loadMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';

    let url = '/api/menu/';
    if (currentCategory) url += `?category=${currentCategory}`;

    const items = await apiGet(url);
    if (!items) return;

    if (items.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">No items in this category.</p></div>';
        return;
    }

    grid.innerHTML = items.map(item => `
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card menu-card h-100 shadow-sm">
                <div class="card-img-top d-flex align-items-center justify-content-center bg-light" style="height:140px;">
                    <i class="bi bi-egg-fried" style="font-size:3rem;color:#adb5bd;"></i>
                </div>
                <div class="card-body">
                    <h6 class="card-title mb-1">${item.name}</h6>
                    <p class="price-tag mb-2">₱${parseFloat(item.price).toFixed(2)}</p>
                    <button class="btn btn-primary btn-sm w-100 add-to-cart-btn"
                            data-item-id="${item.item_id}"
                            data-item-name="${item.name}">
                        <i class="bi bi-plus-circle"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>
    `).join('');

    document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const itemId = parseInt(this.dataset.itemId);
            addToCart(itemId, this);
        });
    });
}

async function addToCart(itemId, btn) {
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    const result = await apiPost('/api/cart/add/', { item_id: itemId, quantity: 1 });

    btn.disabled = false;
    btn.innerHTML = originalText;

    if (result) {
        cartData = result;
        updateCartBadge();
        showCartToast(`${btn.dataset.itemName} added to cart!`);
    }
}

async function loadCart() {
    const data = await apiGet('/api/cart/');
    if (data) {
        cartData = data;
        updateCartBadge();
    }
}

function updateCartBadge() {
    const badge = document.getElementById('cartCountBadge');
    if (badge) {
        badge.textContent = cartData.total_items || 0;
        badge.style.display = (cartData.total_items || 0) > 0 ? '' : 'none';
    }
}

function showCartToast(msg) {
    document.getElementById('cartToastMsg').textContent = msg;
    const toast = new bootstrap.Toast(document.getElementById('cartToast'), { delay: 2000 });
    toast.show();
}

loadMenu();
loadCart();
</script>
{% endblock %}
