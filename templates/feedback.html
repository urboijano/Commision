{% extends 'base.html' %}
{% block title %}Feedback - Food Ordering{% endblock %}
{% block content %}
<div id="feedbackContent">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Loading...</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const orderId = '{{ order_id }}';

async function loadOrderForFeedback() {
    const data = await apiGet(`/api/orders/${orderId}/`);
    const container = document.getElementById('feedbackContent');

    if (!data) {
        container.innerHTML = '<div class="alert alert-danger">Failed to load order.</div>';
        return;
    }

    if (data.status !== 'completed') {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-clock-history" style="font-size:4rem;color:#dee2e6;"></i>
                <h5 class="mt-3">Order is not yet completed</h5>
                <p class="text-muted">Feedback is available after pick-up.</p>
                <a href="/order/${orderId}/track/" class="btn btn-primary">Back to Tracking</a>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="auth-card card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-star" style="font-size:3rem;color:#ffc107;"></i>
                    <h4 class="mt-2">Rate Your Experience</h4>
                    <p class="text-muted">Order #${data.order_number}</p>
                </div>

                <form id="feedbackForm">
                    <div class="mb-4 text-center">
                        <label class="form-label fw-bold">Rating</label>
                        <div class="star-rating d-flex justify-content-center gap-1" id="starRating">
                            ${[1,2,3,4,5].map(i => `
                                <span class="star" data-value="${i}">&#9733;</span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="satisfaction" class="form-label">Satisfaction Level</label>
                        <select class="form-select" id="satisfaction" required>
                            <option value="">Select one...</option>
                            <option value="very_satisfied">Very Satisfied</option>
                            <option value="satisfied">Satisfied</option>
                            <option value="neutral">Neutral</option>
                            <option value="dissatisfied">Dissatisfied</option>
                            <option value="very_dissatisfied">Very Dissatisfied</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="comments" class="form-label">Additional Comments (optional)</label>
                        <textarea class="form-control" id="comments" rows="3" maxlength="500"
                                  placeholder="Tell us about your experience..."></textarea>
                        <small class="text-muted"><span id="charCount">0</span>/500</small>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 btn-lg" id="feedbackBtn">
                        <span id="feedbackSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        <i class="bi bi-send"></i> Submit Feedback
                    </button>
                </form>
            </div>
        </div>
    `;

    let selectedRating = 0;

    document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', function() {
            selectedRating = parseInt(this.dataset.value);
            document.querySelectorAll('.star').forEach((s, idx) => {
                s.classList.toggle('active', idx < selectedRating);
            });
        });
        star.addEventListener('mouseenter', function() {
            const val = parseInt(this.dataset.value);
            document.querySelectorAll('.star').forEach((s, idx) => {
                s.style.color = idx < val ? '#ffc107' : '#ddd';
            });
        });
        star.addEventListener('mouseleave', function() {
            document.querySelectorAll('.star').forEach((s, idx) => {
                s.style.color = idx < selectedRating ? '#ffc107' : '#ddd';
            });
        });
    });

    document.getElementById('comments').addEventListener('input', function() {
        document.getElementById('charCount').textContent = this.value.length;
    });

    document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (selectedRating === 0) {
            showAlert('Please select a rating.', 'warning');
            return;
        }

        const satisfaction = document.getElementById('satisfaction').value;
        if (!satisfaction) {
            showAlert('Please select your satisfaction level.', 'warning');
            return;
        }

        const btn = document.getElementById('feedbackBtn');
        const spinner = document.getElementById('feedbackSpinner');
        btn.disabled = true;
        spinner.classList.remove('d-none');

        const result = await apiPost('/api/feedback/', {
            order_id: orderId,
            rating: selectedRating,
            satisfaction_level: satisfaction,
            comments: document.getElementById('comments').value,
        });

        if (result) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
                    <h4 class="mt-3 fw-bold">Thank You!</h4>
                    <p class="text-muted">Your feedback helps us improve.</p>
                    <a href="/menu/" class="btn btn-primary mt-3">
                        <i class="bi bi-menu-app"></i> Order Again
                    </a>
                    <a href="/orders/" class="btn btn-outline-primary mt-3 ms-2">
                        <i class="bi bi-box"></i> My Orders
                    </a>
                </div>
            `;
        } else {
            btn.disabled = false;
            spinner.classList.add('d-none');
        }
    });
}

loadOrderForFeedback();
</script>
{% endblock %}
