{% extends 'base.html' %}
{% block title %}My Orders - Food Ordering{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0"><i class="bi bi-box"></i> My Orders</h3>
    <a href="/menu/" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> New Order
    </a>
</div>

<div id="ordersContent">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadOrders() {
    const data = await apiGet('/api/orders/');
    const container = document.getElementById('ordersContent');

    if (!data || data.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-inbox" style="font-size:4rem;color:#dee2e6;"></i>
                <h5 class="mt-3 text-muted">No orders yet</h5>
                <a href="/menu/" class="btn btn-primary mt-3">
                    <i class="bi bi-menu-app"></i> Browse Menu
                </a>
            </div>
        `;
        return;
    }

    container.innerHTML = data.map(order => `
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5 class="mb-1">Order #${order.order_number}</h5>
                        <small class="text-muted">${new Date(order.created_at).toLocaleString()}</small>
                    </div>
                    <span class="badge bg-${order.status === 'completed' ? 'success' : order.status === 'ready_for_pickup' ? 'warning' : order.status === 'preparing' ? 'info' : 'secondary'} fs-6">
                        ${order.status_display || order.status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                    </span>
                </div>
                <hr>
                <div class="d-flex justify-content-between">
                    <span>${order.items.length} item(s)</span>
                    <span class="fw-bold">₱${parseFloat(order.total_amount).toFixed(2)}</span>
                </div>
                <div class="mt-2">
                    <a href="/order/${order.order_id}/track/" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-geo-alt"></i> Track
                    </a>
                    ${order.status === 'completed' ? `
                        <a href="/order/${order.order_id}/feedback/" class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-star"></i> Feedback
                        </a>
                    ` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

loadOrders();
</script>
{% endblock %}
